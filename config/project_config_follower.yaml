role: follower

loop_hz: 20

# Set this to your leader's hostname or IP
leader_host: 172.20.10.3
leader_port: 5000

cruise_speed: 0.48
slow_speed: 0.26

follower_max_speed: 0.48
follower_min_speed: 0.0
distance_target: 0.06
distance_kp: 0.6

status_publish_hz: 10
status_poll_hz: 10
request_timeout_s: 0.2
leader_timeout_s: 0.4

stop_hold_s: 2.0
decel_time_s: 0.8
decel_steps: 8

stop_tag_ids: [20, 21, 22, 23, 24, 25, 26, 27, 28]
slow_tag_ids: [39]

sign_confirm_frames: 3
sign_cooldown_s: 2.0
sign_center_roi: 1.0

# AprilTag IDs on leader back (optional; leave empty if leader has no tags)
leader_tag_ids: []

# Vision-based leader avoidance (CNN detects class "duckie")
vision_avoid_enabled: true
vision_leader_class_id: 0
vision_conf_min: 0.5
vision_stop_ratio: 0.12
vision_slow_ratio: 0.06
vision_stop_y_frac: 0.55
vision_detect_interval: 2
