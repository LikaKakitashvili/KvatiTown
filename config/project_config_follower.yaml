role: follower

loop_hz: 20

# Set this to your leader's hostname or IP before deploying.
# When testing on a single bot without a physical leader, set
# solo_test: true so the follower cruises instead of stopping
# when the leader is unreachable.
leader_host: 10.170.14.215
leader_port: 5000

# solo_test: true  — follower drives normally even if leader is offline.
# Set to true for single-bot testing; false for real convoy deployment.
solo_test: false

# visual_follow: true  — follower moves ONLY when it sees the leader AprilTag.
# No code needed on the leader. Works with a manually-driven leader bot.
# Set the AprilTag ID (stuck to the back of the leader) in leader_tag_ids below.
visual_follow: true

cruise_speed: 0.27
slow_speed: 0.16

follower_max_speed: 0.27
follower_min_speed: 0.0
distance_target: 0.06
distance_kp: 0.6

status_publish_hz: 10
status_poll_hz: 10
request_timeout_s: 0.2
leader_timeout_s: 0.4

stop_hold_s: 2.0
slow_hold_s: 2.0
decel_time_s: 0.8
decel_steps: 8

stop_tag_ids: [20, 21, 22, 23, 24, 25, 26, 27, 28]
slow_tag_ids: [39]

sign_confirm_frames: 3
sign_cooldown_s: 2.0
sign_center_roi: 1.0
# Consecutive frames the sign must be ABSENT before the action fires.
# Higher = more tolerant of AprilTag flicker (won't stop while sign still visible).
sign_exit_frames: 6

# AprilTag IDs used to recognize the leader robot.
# Leave empty ([]) to use blue-body color detection instead (no tag needed).
# Set to a specific ID (e.g. [400]) if you have an AprilTag on the leader.
leader_tag_ids: []
