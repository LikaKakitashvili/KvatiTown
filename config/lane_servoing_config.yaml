# Lane servoing PID and detection parameters
# Source: https://github.com/Qristine0/duckieBckp/tree/fixed/servoing
# base_speed is overridden at runtime by the FSM (cruise_speed / slow_speed).
base_speed: 0.30
curve_boost: 1.0
curve_speed: 0.1
curve_threshold: 350
d_gain: 0.11
detection_threshold: 30
max_steer: 0.22
p_gain: 0.20
steering_threshold: 0.2
