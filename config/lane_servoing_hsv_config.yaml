# HSV color bounds for lane marking detection.
# Source: https://github.com/Qristine0/duckieBckp/tree/fixed/servoing
# Adjust via the web UI sliders if needed — changes are saved back here.

# Yellow line (left / centre dashed line)
yellow_lower_h: 18
yellow_lower_s: 70
yellow_lower_v: 70
yellow_upper_h: 42
yellow_upper_s: 255
yellow_upper_v: 255

# White line (right / edge solid line)
white_lower_h: 0
white_lower_s: 0
white_lower_v: 205
white_upper_h: 179
white_upper_s: 42
white_upper_v: 255
