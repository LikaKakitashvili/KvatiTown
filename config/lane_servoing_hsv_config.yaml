# White lane line (low saturation, bright)
white_lower_h: 0
white_lower_s: 0
white_lower_v: 160
white_upper_h: 179
white_upper_s: 80
white_upper_v: 255

# Yellow — primary band (orange/yellow tape)
yellow_lower_h: 18
yellow_lower_s: 85
yellow_lower_v: 85
yellow_upper_h: 38
yellow_upper_s: 255
yellow_upper_v: 255

# Alt band picks up cyan floor tiles — keep off unless tape looks green on your bot
yellow_use_alt_band: false
yellow_alt_lower_h: 82
yellow_alt_lower_s: 80
yellow_alt_lower_v: 90
yellow_alt_upper_h: 100
yellow_alt_upper_s: 255
yellow_alt_upper_v: 255

# Ignore top portion of frame (chairs/background clutter)
top_exclude_frac: 0.30

# Spatial search regions (fraction of image width)
yellow_side_width_frac: 0.78   # yellow searched on left ~78% of frame
white_side_width_frac: 0.85    # white: right 85% of frame
yellow_center_exclude_frac: 0.14
yellow_center_exclude_from_row_frac: 0.35  # center cut only in lower frame (floor noise)
edge_mag_threshold: 28
use_white_balance: true
